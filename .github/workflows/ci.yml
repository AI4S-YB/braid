name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install BAM decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
      - name: Test
        env:
          PLENA_REQUIRE_SAMTOOLS: "1"
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: plena
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: plena.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin plena --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BINARY}"
          "$bin" --version
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="ci-${GITHUB_SHA:0:7}"
          fi
          name="plena-${version}-${TARGET}"
          mkdir -p dist
          if [[ "${ARCHIVE}" == "zip" ]]; then
            tar -a -cf "dist/${name}.zip" -C "target/${TARGET}/release" "${BINARY}"
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" "${BINARY}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: plena-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plena-*
          path: dist
          merge-multiple: true
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          # ${GITHUB_REF_NAME}

          预编译二进制：

          - Linux x86_64（glibc）：\`plena-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\`，解压后是 \`plena\`
          - Windows x86_64（MSVC）：\`plena-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip\`，解压后是 \`plena.exe\`

          本版包含 TAMA collapse、TAMA merge、FLAIR combine 和 TACO meta-assembly。许可证 GPL-3.0-only。

          更新内容：

          - 完成 TAMA merge，支持来源优先级、capped/no_cap 混合、重复模型处理及来源 ID/CDS 保留。
          - TAMA collapse 新增 no_cap、low_mem 和 BAM 支持，并兼容原版单横线参数。
          - 新增与 tacorna/taco 0.7.3 对照的 TACO meta-assembly。
          - 修复 FLAIR 连续过滤映射、混合 FASTA 输入和 FASTA 空行处理。
          - 扩充算法对照、命令行兼容性和 BAM 回归测试。

          TAMA collapse 支持 capped/no_cap、original/low_mem 和 SAM/BAM；读取 BAM 需要在 PATH 中安装 samtools。
          Linux 包在 GitHub 的 Ubuntu 运行器上编译，需要与该系统相近的 glibc。
          EOF
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file ../notes.md
