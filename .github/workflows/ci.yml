name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: braid
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: braid.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin braid --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BINARY}"
          "$bin" --version
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="ci-${GITHUB_SHA:0:7}"
          fi
          name="braid-${version}-${TARGET}"
          mkdir -p dist
          if [[ "${ARCHIVE}" == "zip" ]]; then
            tar -a -cf "dist/${name}.zip" -C "target/${TARGET}/release" "${BINARY}"
          else
            tar -czf "dist/${name}.tar.gz" -C "target/${TARGET}/release" "${BINARY}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: braid-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: braid-*
          path: dist
          merge-multiple: true
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          # ${GITHUB_REF_NAME}

          预编译二进制：

          - Linux x86_64（glibc）：\`braid-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz\`，解压后是 \`braid\`
          - Windows x86_64（MSVC）：\`braid-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip\`，解压后是 \`braid.exe\`

          本版包含 TAMA collapse（original capped 模式）和 FLAIR combine。许可证 GPL-3.0-only。
          Linux 包在 GitHub 的 Ubuntu 运行器上编译，需要与该系统相近的 glibc。
          EOF
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file ../notes.md
